name: update

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Run update script
        run: ./scripts/update.sh
      - name: Create pull request
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: update claudezilla"
          title: "chore: update claudezilla"
          body: |
            Automated weekly bump of the claudezilla native host (upstream `main`)
            and the AMO Firefox extension xpi.

            The native host and extension were already built and `nix flake check`ed
            by the update job before this PR was opened, so this is merged automatically.
          branch: chore/update-claudezilla
          labels: |
            dependencies
            automated
          delete-branch: true
      - name: Merge pull request
        if: steps.cpr.outputs.pull-request-operation == 'created' || steps.cpr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ steps.cpr.outputs.pull-request-number }}
        # Reaching this step implies the in-job build + flake check already passed, so
        # the validated bump can land directly. (build.yml does not re-run on PRs opened
        # by GITHUB_TOKEN, so there are no extra checks to gate on here.)
        run: gh pr merge --squash --delete-branch "$PR"
